name: Web-Fassung
# Baut bei jedem Release die Web-Fassung (/app/) und hängt sie als ZIP an das Release.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run i18n:check
      - run: npm run build:web
      - name: ZIP und Prüfsumme
        run: |
          VERSION=$(node -p "require('./package.json').version")
          cd dist && zip -qr "../taleward-web-$VERSION.zip" . && cd ..
          sha256sum "taleward-web-$VERSION.zip" > "taleward-web-$VERSION.zip.sha256"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: An das Release hängen
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "taleward-web-$VERSION.zip" "taleward-web-$VERSION.zip.sha256" --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: taleward-web
          path: taleward-web-*.zip*
