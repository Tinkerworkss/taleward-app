name: Fassung veröffentlichen
# Wie „Fassung markieren“ beim Server – nur mit Release: Liegt im Hauptverzeichnis eine Datei release.md, entsteht
# daraus das GitHub-Release v<Version> (Version aus package.json, Titel „Taleward <Version>“, Text = release.md,
# erscheint in der App als „Was ist neu“). Danach werden signierte APK und Web-Fassung gebaut und angehängt.
# release.md wird wieder entfernt. Gibt es das Release schon, bricht der Ablauf ab (zuerst Version erhöhen).
on:
  push:
    branches: [main]
    paths: ["release.md"]

permissions:
  contents: write

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.anlegen.outputs.tag }}
      version: ${{ steps.anlegen.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Release anlegen
        id: anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [ -f release.md ] || { echo "Keine release.md – nichts zu tun."; exit 0; }
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG gibt es schon – zuerst die Version in package.json erhöhen."; exit 1
          fi
          cp release.md "$RUNNER_TEMP/notes.md"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q release.md
          git commit -q -m "Release-Text für $TAG übernommen"
          git push -q origin HEAD:main
          gh release create "$TAG" --target "$(git rev-parse HEAD)" --title "Taleward $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  apk:
    needs: release
    if: needs.release.outputs.tag != ''
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.release.outputs.tag }}
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run i18n:check
      - name: Web-Teil bauen und Android-Projekt anlegen
        run: |
          npm run build
          npx cap add android
          node scripts/setup-android.mjs
          npx cap sync android
      - name: Signierte APK bauen
        env:
          KEYSTORE_B64: ${{ secrets.TALEWARD_KEYSTORE_BASE64 }}
          TALEWARD_KEYSTORE_PASSWORD: ${{ secrets.TALEWARD_KEYSTORE_PASSWORD }}
          TALEWARD_KEY_ALIAS: ${{ secrets.TALEWARD_KEY_ALIAS }}
          TALEWARD_KEY_PASSWORD: ${{ secrets.TALEWARD_KEY_PASSWORD }}
        run: |
          [ -n "$KEYSTORE_B64" ] || { echo "Secret TALEWARD_KEYSTORE_BASE64 fehlt"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/taleward.jks"
          export TALEWARD_KEYSTORE="$RUNNER_TEMP/taleward.jks"
          cd android && ./gradlew assembleRelease --no-daemon
          cd ..
          cp android/app/build/outputs/apk/release/app-release.apk "taleward-$VERSION.apk"
          sha256sum "taleward-$VERSION.apk" > "taleward-$VERSION.apk.sha256"
          rm -f "$RUNNER_TEMP/taleward.jks"
      - name: An das Release hängen
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "taleward-$VERSION.apk" "taleward-$VERSION.apk.sha256" --clobber

  web:
    needs: release
    if: needs.release.outputs.tag != ''
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.release.outputs.tag }}
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run i18n:check
      - run: npm run build:web
      - name: ZIP und Prüfsumme
        run: |
          cd dist && zip -qr "../taleward-web-$VERSION.zip" . && cd ..
          sha256sum "taleward-web-$VERSION.zip" > "taleward-web-$VERSION.zip.sha256"
      - name: An das Release hängen
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "taleward-web-$VERSION.zip" "taleward-web-$VERSION.zip.sha256" --clobber
