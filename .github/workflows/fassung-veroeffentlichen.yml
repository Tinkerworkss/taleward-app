name: Fassung veröffentlichen
# Liegt im Hauptverzeichnis eine Datei release.md, entsteht daraus das Release v<Version> (Version aus package.json,
# Titel „Taleward <Version>“, Text = release.md, erscheint in der App als „Was ist neu“). release.md wird entfernt.
# Ablauf: Entwurf anlegen → Web-Fassung und APK (unsigniert) bauen → APK signieren, alles anhängen → veröffentlichen.
# Erst der fertige Entwurf wird veröffentlicht; eine veröffentlichte Fassung wird nie mehr verändert.
# Schlägt ein Bau fehl: „Re-run failed jobs“. Gibt es das Release schon, bricht der Ablauf ab (zuerst Version erhöhen).
on:
  push:
    branches: [main]
    paths: ["release.md"]

permissions: {}

concurrency: release

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.anlegen.outputs.tag }}
      version: ${{ steps.anlegen.outputs.version }}
      sha: ${{ steps.anlegen.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Entwurf anlegen
        id: anlegen
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          [ -f release.md ] || { echo "Keine release.md – nichts zu tun."; exit 0; }
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG gibt es schon – zuerst die Version in package.json erhöhen."; exit 1
          fi
          cp release.md "$RUNNER_TEMP/notes.md"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q release.md
          git commit -q -m "Release-Text für $TAG übernommen"
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push -q "https://github.com/$GH_REPO.git" HEAD:main
          SHA=$(git rev-parse HEAD)
          gh release create "$TAG" --draft --target "$SHA" --title "Taleward $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "sha=$SHA"
          } >> "$GITHUB_OUTPUT"

  web:
    needs: release
    if: needs.release.outputs.tag != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm run i18n:check
      - run: npm run build:web
      - name: ZIP und Prüfsumme
        run: |
          cd dist && zip -qr "../taleward-web-$VERSION.zip" . && cd ..
          sha256sum "taleward-web-$VERSION.zip" > "taleward-web-$VERSION.zip.sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web
          path: taleward-web-*
          retention-days: 3

  apk:
    needs: release
    if: needs.release.outputs.tag != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --ignore-scripts
      - run: npm run i18n:check
      - name: Web-Teil bauen und Android-Projekt anlegen
        run: |
          npm run build
          npx cap add android
          node scripts/setup-android.mjs
          npx cap sync android
      - name: APK bauen (ohne Signatur – der Schlüssel kommt hier nie hin)
        run: |
          cd android && ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release-unsigned.apk "$GITHUB_WORKSPACE/unsigned.apk"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apk-unsigned
          path: unsigned.apk
          retention-days: 3

  veroeffentlichen:
    needs: [release, web, apk]
    runs-on: ubuntu-24.04
    # Signierschlüssel liegen nur in dieser Umgebung; sie ist auf main beschränkt
    environment: apk-signatur
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release.outputs.tag }}
      VERSION: ${{ needs.release.outputs.version }}
      GH_REPO: ${{ github.repository }}
      # Fingerabdruck des Taleward-Signierzertifikats – jede andere Signatur bricht ab (sonst keine Updates möglich)
      CERT_SHA256: 6a3e3ef2210c19d74ea39e372a03061f5096ede1b37a943aaa0121438e2bf573
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dl
          merge-multiple: true
      - name: APK signieren
        env:
          KEYSTORE_B64: ${{ secrets.TALEWARD_KEYSTORE_BASE64 }}
          TALEWARD_KEYSTORE_PASSWORD: ${{ secrets.TALEWARD_KEYSTORE_PASSWORD }}
          TALEWARD_KEY_ALIAS: ${{ secrets.TALEWARD_KEY_ALIAS }}
          TALEWARD_KEY_PASSWORD: ${{ secrets.TALEWARD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          [ -n "$KEYSTORE_B64" ] || { echo "Secret TALEWARD_KEYSTORE_BASE64 fehlt"; exit 1; }
          BT=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          KS="$RUNNER_TEMP/taleward.jks"
          trap 'rm -f "$KS"' EXIT
          echo "$KEYSTORE_B64" | base64 -d > "$KS"
          # Gradle liefert die APK schon ausgerichtet; nur falls nicht, ausrichten
          if "$BT/zipalign" -c 4 dl/unsigned.apk >/dev/null 2>&1; then
            cp dl/unsigned.apk "$RUNNER_TEMP/aligned.apk"
          else
            "$BT/zipalign" -p -f 4 dl/unsigned.apk "$RUNNER_TEMP/aligned.apk"
          fi
          "$BT/apksigner" sign --ks "$KS" --ks-key-alias "$TALEWARD_KEY_ALIAS" \
            --ks-pass env:TALEWARD_KEYSTORE_PASSWORD --key-pass env:TALEWARD_KEY_PASSWORD \
            --out "taleward-$VERSION.apk" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --print-certs "taleward-$VERSION.apk" | tee "$RUNNER_TEMP/certs.txt"
          grep -qi "SHA-256 digest: $CERT_SHA256" "$RUNNER_TEMP/certs.txt" || { echo "Falsches Zertifikat – Abbruch"; exit 1; }
      - name: Prüfsummen und fester Name taleward.apk
        run: |
          set -euo pipefail
          sha256sum "taleward-$VERSION.apk" > "taleward-$VERSION.apk.sha256"
          cp "taleward-$VERSION.apk" taleward.apk
          sha256sum taleward.apk > taleward.apk.sha256
          cp dl/taleward-web-* .
      - name: Anhängen und veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [ "$(gh release view "$TAG" --json isDraft -q .isDraft)" = "true" ] || { echo "$TAG ist schon veröffentlicht – nichts verändern"; exit 1; }
          gh release upload "$TAG" \
            "taleward-$VERSION.apk" "taleward-$VERSION.apk.sha256" taleward.apk taleward.apk.sha256 \
            "taleward-web-$VERSION.zip" "taleward-web-$VERSION.zip.sha256"
          gh release edit "$TAG" --draft=false --latest
