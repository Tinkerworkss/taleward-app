name: Patch einspielen
# Lädt man eine *.patch-Datei ins Hauptverzeichnis hoch, spielt dieser Ablauf sie ein, prüft den Code und schiebt das
# Ergebnis auf main. Die Patch-Datei selbst wird wieder entfernt.
# Zwei Schritte: „pruefen“ baut ohne Schreibrecht (fremder Code aus npm läuft nur hier), „hochladen“ schiebt das
# geprüfte Ergebnis ohne Bauen auf main.
on:
  push:
    branches: [main]
    paths: ["*.patch"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: patch-einspielen
  cancel-in-progress: false

jobs:
  pruefen:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Patch anwenden
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p "$RUNNER_TEMP/patches"
          ls ./*.patch
          cp ./*.patch "$RUNNER_TEMP/patches/"
          git rm -q ./*.patch
          git commit -q -m "Patch-Datei entfernt"
          git am --3way --committer-date-is-author-date "$RUNNER_TEMP"/patches/*.patch
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Prüfen
        run: |
          npm ci --ignore-scripts
          npm run i18n:check
          npx tsc -b
          npm run build:mock
          npm run build:web
      - name: Ergebnis bündeln
        env:
          BASIS: ${{ github.sha }}
        run: git bundle create "$RUNNER_TEMP/ergebnis.bundle" "$BASIS..HEAD"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ergebnis
          path: ${{ runner.temp }}/ergebnis.bundle
          retention-days: 1

  hochladen:
    needs: pruefen
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ergebnis
          path: ${{ runner.temp }}/ergebnis
      - name: Auf main schieben
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git fetch -q "$RUNNER_TEMP/ergebnis/ergebnis.bundle" HEAD
          git merge -q --ff-only FETCH_HEAD
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push -q "https://github.com/$GH_REPO.git" HEAD:main
