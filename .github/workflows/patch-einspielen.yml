name: Patch einspielen
# Lädt man eine *.patch-Datei ins Hauptverzeichnis hoch, spielt dieser Ablauf sie ein,
# prüft den Code und schiebt das Ergebnis auf main. Die Patch-Datei selbst wird wieder entfernt.
on:
  push:
    branches: [main]
    paths: ["*.patch"]
  workflow_dispatch:

permissions: {}

jobs:
  einspielen:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Patch anwenden
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/patches
          ls *.patch
          cp *.patch /tmp/patches/
          git rm -q *.patch
          git commit -q -m "Patch-Datei entfernt"
          git am --3way --committer-date-is-author-date /tmp/patches/*.patch
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Prüfen
        run: |
          npm ci --ignore-scripts
          npm run i18n:check
          npx tsc -b
          npm run build:mock
          npm run build:web
      - name: Hochladen
        run: git push
